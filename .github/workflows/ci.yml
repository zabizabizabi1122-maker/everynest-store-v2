name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs: no secrets or external services required.
  quality:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # The build renders client shells only; no real project is contacted.
          # Use harmless placeholders so env validation passes in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Production dependency audit
        run: npm audit --omit=dev

  # Opt-in: enable by setting the repository variable ENABLE_DB_TESTS=true.
  # ubuntu-latest provides Docker, required by local Supabase + pgTAP.
  database-tests:
    name: Database migrations and pgTAP
    if: vars.ENABLE_DB_TESTS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      - name: Seed verifier (read-only)
        # `db query` targets local Supabase by default; there is no --local flag.
        run: supabase db query --file supabase/tests/seed_verify.sql

      - name: pgTAP security tests
        # `test db` also targets local by default.
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # Opt-in: enable by setting ENABLE_E2E=true and configuring the secrets below.
  # Never point this job at a production project or a database with real data.
  end-to-end:
    name: Playwright storefront flow
    if: vars.ENABLE_E2E == 'true'
    runs-on: ubuntu-latest
    # Job-level env so both `next build` (NEXT_PUBLIC_* is inlined at build time)
    # and the `next start` server launched by Playwright's webServer see it.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run E2E flow
        # Do NOT set E2E_BASE_URL: playwright.config.ts then starts the built app
        # itself through `webServer` (npm run start -- -p 3000).
        run: npm run test:e2e
        env:
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
